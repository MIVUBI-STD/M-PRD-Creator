name: Voice Verify

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Voice contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock.txt -r requirements-dev.lock.txt
          python -m pip check

      - name: Static quality
        run: |
          ruff format --check kits/prd-creator tests tools
          ruff check kits/prd-creator tests tools
          mypy kits/prd-creator/shared kits/prd-creator/renderer kits/prd-creator/validator

      - name: Compile Voice sources
        run: |
          python -m compileall -q \
            kits/prd-creator/shared \
            kits/prd-creator/validator/validate_handoff.py \
            kits/prd-creator/validator/voice_validation.py \
            kits/prd-creator/validator/validate_voice.py \
            kits/prd-creator/renderer/production_assets.py \
            kits/prd-creator/renderer/production_assets_compositor.py \
            kits/prd-creator/renderer/template_adapter.py \
            tests/prd_fixture.py \
            tests/test_voice_contracts.py \
            tests/test_prd_voice_assets.py

      - name: Voice Production contracts
        run: |
          python -m unittest discover -s tests -p "test_voice_contracts.py" -v
          python -m unittest discover -s tests -p "test_prd_voice_assets.py" -v
