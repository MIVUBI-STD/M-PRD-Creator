name: Release Verify

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Open Local to main PR number"
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Stable release gate
    runs-on: ubuntu-latest

    steps:
      - name: Validate selected promotion pull request
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "Local" ]]; then
            echo "Run this manual workflow on Local." >&2
            exit 1
          fi
          if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "A positive pull request number is required." >&2
            exit 1
          fi
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          from="$(jq -r '.head.ref // empty' <<< "${pr}")"
          to="$(jq -r '.base.ref // empty' <<< "${pr}")"
          source_repo="$(jq -r '.head.repo.full_name // empty' <<< "${pr}")"
          base_repo="$(jq -r '.base.repo.full_name // empty' <<< "${pr}")"
          state="$(jq -r '.state // empty' <<< "${pr}")"
          head_sha="$(jq -r '.head.sha // empty' <<< "${pr}")"
          mergeable="$(jq -r '.mergeable // empty' <<< "${pr}")"
          merge_sha="$(jq -r '.merge_commit_sha // empty' <<< "${pr}")"

          if [[ "${state}" != "open" || "${from}" != "Local" || "${to}" != "main" ||
                "${source_repo}" != "${GITHUB_REPOSITORY}" || "${base_repo}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "PR must be open and from Local to main in this repository." >&2
            exit 1
          fi
          if [[ "${head_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Manual dispatch HEAD does not match the selected PR head." >&2
            exit 1
          fi
          if [[ "${mergeable}" != "true" || ! "${merge_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A mergeable PR test-merge SHA is required; resolve conflicts or retry after GitHub computes mergeability." >&2
            exit 1
          fi
          printf 'merge_sha=%s\n' "${merge_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.merge_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock.txt -r requirements-dev.lock.txt
          python -m pip check

      - name: Verify repository contracts
        run: python tools/verify_repository.py

      - name: Static quality
        run: |
          ruff format --check kits/prd-creator tests tools
          ruff check kits/prd-creator tests tools
          mypy kits/prd-creator/shared kits/prd-creator/renderer kits/prd-creator/validator

      - name: Run full regression suite
        env:
          PRD_BROWSER_TEST: "1"
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py" -v
          coverage report --fail-under=84

      - name: Release policy reminder
        run: |
          echo "Release source: Local."
          echo "Required merge method: merge commit."
          echo "Manually verified the PR test-merge candidate; re-run if source/target changes."
          echo "Do not merge main release-marker commits back into Local merely to satisfy ancestry."
